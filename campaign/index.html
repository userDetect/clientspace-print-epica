<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="print-demo-id" content="demos">
<title>Типографии и вывески · ClientSpace</title>
<link rel="stylesheet" href="site.css">
<script src="businesses.js" defer></script>
<script src="site.js" defer></script>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <a class="studio" href="https://client-space.ru/">ClientSpace ↗</a>
    <h1>Типографии<br>и вывески</h1>
    <p>Демо-сайты, аудит, контакты и письма для компаний Нижегородской области.</p>
  </div>
</header>
<main class="wrap">
  <form id="filters" aria-label="Фильтры списка">
    <label class="search"><span>Название или город</span><input type="search" id="search" placeholder="Например, Дзержинск"></label>
    <label><span>Доступный контакт</span><select id="channel"><option value="">Любой</option><option value="email">Почта</option><option value="telegram">Telegram</option><option value="whatsapp">WhatsApp</option><option value="max">MAX</option><option value="vk">ВКонтакте</option><option value="phone">Телефон</option></select></label>
    <label><span>Отметка</span><select id="filter-progress"><option value="">Все</option><option value="unwritten">Не написал</option><option value="written">Написал</option></select></label>
  </form>
  <p id="results" role="status"></p>
  <ul id="list" aria-label="Список компаний"></ul>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <header class="dialog-header"><div><p id="detail-city"></p><h2 id="detail-title"></h2></div><button id="close" type="button" aria-label="Закрыть">×</button></header>
  <div class="dialog-content" id="detail-content"></div>
</dialog>
</body>
</html>
